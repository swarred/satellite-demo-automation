---
# ── Pre-requisites ─────────────────────────────────────────────────────────────

- name: Get ground station route (for status panel JavaScript URL)
  command: >-
    oc get route ground-station -n {{ ocp_namespace }}
    -o jsonpath='{.spec.host}'
  register: _gs_route_host
  changed_when: false

- name: Get flightctl API route (datasource base URL)
  command: >-
    oc get route flightctl-api-route -n {{ flightctl_namespace }}
    -o jsonpath='{.spec.host}'
  register: _fc_api_host
  changed_when: false

# Fetch the OCP ingress router CA so Grafana's Go TLS stack trusts the flightctl
# API route.  Infinity's backend HTTP client does not honour tlsSkipVerify from
# jsonData; mounting the CA into /etc/ssl/certs/ (a directory Go scans at
# startup) is the reliable fix without disabling TLS globally.
- name: Get OCP ingress router CA cert
  shell: >-
    oc get secret router-ca -n openshift-ingress-operator
    -o jsonpath='{.data.tls\.crt}' | base64 -d
  register: _ocp_ingress_ca
  changed_when: false

- name: Write OCP ingress CA to temp file
  copy:
    content: "{{ _ocp_ingress_ca.stdout }}"
    dest: /tmp/ocp-ingress-ca.pem
    mode: '0644'

- name: Create OCP ingress CA ConfigMap for Grafana trust store
  shell: >-
    oc create configmap grafana-ocp-ca
    --from-file=ocp-ca.pem=/tmp/ocp-ingress-ca.pem
    -n {{ ocp_namespace }}
    --dry-run=client -o yaml | oc apply -f -
  changed_when: true

# ── Service account and SCC ────────────────────────────────────────────────────
# Grafana runs as UID 472; OCP's restricted SCC blocks this by default.
# anyuid SCC allows the pod to run as its declared UID without a namespace range.

- name: Create Grafana service account
  shell: >-
    oc create serviceaccount satellite-grafana
    -n {{ ocp_namespace }}
    --dry-run=client -o yaml | oc apply -f -
  changed_when: true

- name: Grant anyuid SCC to Grafana service account
  command: >-
    oc adm policy add-scc-to-user anyuid
    system:serviceaccount:{{ ocp_namespace }}:satellite-grafana
  changed_when: true

# ── flightctl RBAC for Grafana SA ─────────────────────────────────────────────
# flightctl resolves authorization via OCP namespace-scoped RoleBindings in the
# flightctl namespace.  Without a binding the SA token gets HTTP 200 with zero
# items — same empty-list behaviour as an unrecognised user.

- name: Bind Grafana SA to flightctl-org-admin role in flightctl namespace
  shell: >-
    oc create rolebinding grafana-flightctl-readonly
    --clusterrole=flightctl-org-admin-{{ flightctl_namespace }}
    --serviceaccount={{ ocp_namespace }}:satellite-grafana
    -n {{ flightctl_namespace }}
    --dry-run=client -o yaml | oc apply -f -
  changed_when: true

# ── ConfigMaps ─────────────────────────────────────────────────────────────────

- name: Template Grafana datasource config
  template:
    src: grafana-datasource.yml.j2
    dest: /tmp/grafana-datasource.yml
    mode: '0600'

- name: Template Grafana dashboard provider config
  template:
    src: grafana-dashboard-provider.yml.j2
    dest: /tmp/grafana-dashboard-provider.yml
    mode: '0644'

- name: Template satellite dashboard JSON
  template:
    src: satellite-dashboard.json.j2
    dest: /tmp/satellite-dashboard.json
    mode: '0644'

- name: Apply Grafana datasource ConfigMap
  shell: >-
    oc create configmap grafana-datasources
    --from-file=datasource.yaml=/tmp/grafana-datasource.yml
    -n {{ ocp_namespace }}
    --dry-run=client -o yaml | oc apply -f -
  changed_when: true

- name: Apply Grafana dashboard provider ConfigMap
  shell: >-
    oc create configmap grafana-dashboard-provider
    --from-file=provider.yaml=/tmp/grafana-dashboard-provider.yml
    -n {{ ocp_namespace }}
    --dry-run=client -o yaml | oc apply -f -
  changed_when: true

- name: Apply satellite dashboard ConfigMap
  shell: >-
    oc create configmap satellite-dashboard
    --from-file=satellite.json=/tmp/satellite-dashboard.json
    -n {{ ocp_namespace }}
    --dry-run=client -o yaml | oc apply -f -
  changed_when: true

# ── Grafana Deployment, Service, Route ─────────────────────────────────────────

- name: Template Grafana manifests
  template:
    src: grafana-manifests.yml.j2
    dest: /tmp/grafana-manifests.yml
    mode: '0644'

- name: Apply Grafana Deployment, Service, and Route
  command: oc apply -f /tmp/grafana-manifests.yml -n {{ ocp_namespace }}
  changed_when: true

- name: Wait for Grafana rollout
  command: >-
    oc rollout status deployment/{{ grafana_service_name }}
    -n {{ ocp_namespace }}
    --timeout=300s
  changed_when: false

# ── Output ─────────────────────────────────────────────────────────────────────

- name: Get Grafana route URL
  command: >-
    oc get route {{ grafana_service_name }}
    -n {{ ocp_namespace }}
    -o jsonpath='{.spec.host}'
  register: grafana_route_host
  changed_when: false

- name: Display Grafana URL
  debug:
    msg:
      - "Grafana: https://{{ grafana_route_host.stdout }}"
      - "Login:   admin / {{ grafana_admin_password }}"
      - "Dashboard: Satellite Edge Status"
