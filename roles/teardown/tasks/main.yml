---
- name: Log in to OCP
  command: >-
    oc login {{ ocp_api_url }}
    --token={{ ocp_token }}
    --insecure-skip-tls-verify=true
  no_log: true
  changed_when: true

- name: Delete OCP namespace (removes all resources including skupper site)
  command: >-
    oc delete project {{ ocp_namespace }}
    --ignore-not-found=true
  changed_when: true

- name: Wait for namespace to be fully deleted
  command: >-
    oc wait namespace/{{ ocp_namespace }}
    --for=delete
    --timeout=120s
  failed_when: false

- name: Destroy VM (ignore if not running)
  command: virsh --connect qemu:///system destroy {{ vm_name }}
  become: true
  failed_when: false
  changed_when: true

- name: Undefine VM (ignore if not defined)
  command: virsh --connect qemu:///system undefine {{ vm_name }}
  become: true
  failed_when: false
  changed_when: true

- name: Remove VM disk image
  file:
    path: "{{ vm_image_dest }}"
    state: absent
  become: true

- name: Delete RHSI Subscription
  command: >-
    oc delete subscription skupper-operator
    -n service-interconnect
    --ignore-not-found=true
  changed_when: true

- name: Delete RHSI ClusterServiceVersion
  shell: >-
    oc delete csv
    $(oc get csv -n service-interconnect --no-headers -o custom-columns=":metadata.name" | grep skupper-operator || true)
    -n service-interconnect
    --ignore-not-found=true
  changed_when: true
  failed_when: false

- name: Delete service-interconnect namespace
  command: >-
    oc delete namespace service-interconnect
    --ignore-not-found=true
  changed_when: true

- name: Wait for service-interconnect namespace to be deleted
  command: >-
    oc wait namespace/service-interconnect
    --for=delete
    --timeout=120s
  failed_when: false
  changed_when: false

- name: Stop local image registry
  command: podman rm -f {{ local_registry_name }}
  failed_when: false
  changed_when: true

- name: Remove registry data volume
  command: podman volume rm {{ local_registry_name }}-data
  failed_when: false
  changed_when: true

- name: Close local registry port in libvirt firewall zone
  shell: |
    firewall-cmd --zone=libvirt --remove-port={{ local_registry_port }}/tcp --permanent
    firewall-cmd --zone=libvirt --remove-port={{ local_registry_port }}/tcp
  become: true
  failed_when: false
  changed_when: true

- name: Delete satellite-sim devices from Edge Manager
  shell: |
    flightctl get devices -l role=satellite-sim -o json 2>/dev/null |
    python3 -c "
    import sys, json, subprocess
    items = json.load(sys.stdin).get('items', [])
    for d in items:
        subprocess.run(['flightctl', 'delete', 'device/' + d['metadata']['name']], check=False)
    print(len(items), 'device(s) deleted')
    "
  changed_when: true
  failed_when: false

- name: Remove generated flightctl enrollment config from build context
  file:
    path: "{{ satellite_demo_src }}/flightctl/config.yaml"
    state: absent

- name: Uninstall flightctl Helm release (runs post-delete cleanup hooks)
  command: helm uninstall flightctl -n {{ flightctl_namespace }}
  failed_when: false
  changed_when: true

- name: Delete flightctl namespace
  command: >-
    oc delete namespace {{ flightctl_namespace }}
    --ignore-not-found=true
  changed_when: true

- name: Delete flightctl-org-admin ClusterRole (created by playbook, not Helm)
  command: >-
    oc delete clusterrole flightctl-org-admin-{{ flightctl_namespace }}
    --ignore-not-found=true
  changed_when: true

- name: Teardown complete
  debug:
    msg:
      - "OCP namespace '{{ ocp_namespace }}' deleted"
      - "VM '{{ vm_name }}' destroyed and undefined"
      - "Local registry stopped, firewall port {{ local_registry_port }} closed"
      - "flightctl namespace and ClusterRole removed"
      - "Ready to re-run: ansible-playbook site.yml"
