---
- name: Template cloud-init user-data with skupper token
  template:
    src: user-data.j2
    dest: /tmp/satellite-demo-user-data
    mode: '0644'

- name: Destroy existing VM (ignore if not running)
  command: virsh --connect qemu:///system destroy {{ vm_name }}
  become: true
  failed_when: false
  changed_when: true

- name: Undefine existing VM (ignore if not defined)
  command: virsh --connect qemu:///system undefine {{ vm_name }}
  become: true
  failed_when: false
  changed_when: true

- name: Copy qcow2 to libvirt images directory
  copy:
    src: "{{ bootc_output_dir }}/qcow2/disk.qcow2"
    dest: "{{ vm_image_dest }}"
    remote_src: true
  become: true

- name: Deploy VM with virt-install
  command: >-
    virt-install
    --connect qemu:///system
    --name {{ vm_name }}
    --memory {{ vm_memory }}
    --vcpus {{ vm_vcpus }}
    --disk {{ vm_image_dest }},format=qcow2,bus=virtio
    --import
    --os-variant centos-stream10
    --network network=default,model=virtio
    --graphics none
    --console pty,target_type=serial
    --noautoconsole
    --cloud-init user-data=/tmp/satellite-demo-user-data
  become: true
  changed_when: true

- name: Wait for VM to receive IP address (DHCP lease)
  shell: >-
    virsh --connect qemu:///system domifaddr {{ vm_name }} 2>/dev/null
    | awk '/ipv4/ {print $4}' | cut -d/ -f1
  become: true
  register: vm_ip_result
  until: vm_ip_result.stdout | trim | length > 0
  retries: 30
  delay: 10
  changed_when: false

- name: Store VM IP
  set_fact:
    vm_ip: "{{ vm_ip_result.stdout | trim }}"

- name: Wait for SSH to be available on VM
  wait_for:
    host: "{{ vm_ip }}"
    port: 22
    timeout: 120

# Clear any stale known_hosts entry for this IP — the VM is always a fresh
# deployment with a new host key; StrictHostKeyChecking=no alone doesn't
# help when a key has *changed*, so bypass known_hosts entirely.
- name: Remove stale SSH known_hosts entry for VM IP
  command: ssh-keygen -R {{ vm_ip }}
  failed_when: false
  changed_when: true

- name: Clean up temporary user-data file
  file:
    path: /tmp/satellite-demo-user-data
    state: absent

- name: Wait for skupper-init to link (poll .linked file, up to 3 min)
  shell: >-
    sshpass -p satellite ssh
    -o StrictHostKeyChecking=no
    -o UserKnownHostsFile=/dev/null
    demo@{{ vm_ip }}
    "sudo test -f /var/lib/skupper/.linked && echo linked || echo unlinked"
  register: link_file_check
  until: link_file_check.stdout == 'linked'
  retries: 18
  delay: 10
  changed_when: false
  failed_when: false

- name: Check whether skupper link was established
  shell: >-
    sshpass -p satellite ssh
    -o StrictHostKeyChecking=no
    -o UserKnownHostsFile=/dev/null
    demo@{{ vm_ip }}
    "sudo test -f /var/lib/skupper/.linked && echo linked || echo unlinked"
  register: link_status
  changed_when: false

- name: Recover skupper link (skupper-init failed on first boot)
  shell: |
    sshpass -p satellite ssh \
      -o StrictHostKeyChecking=no \
      -o UserKnownHostsFile=/dev/null \
      demo@{{ vm_ip }} bash -s <<'ENDSSH'
    set -e
    sudo /usr/local/bin/skupper token redeem /etc/skupper/token.yaml -p linux -n satellite-vm
    sudo /usr/local/bin/skupper system apply -p linux -n satellite-vm -f /etc/skupper/connector.yaml
    sudo /usr/local/bin/skupper system reload -p linux -n satellite-vm
    sudo touch /var/lib/skupper/.linked
    ENDSSH
  when: link_status.stdout == 'unlinked'

# ── Edge Manager enrollment ────────────────────────────────────────────────────
# Wait for the flightctl-agent on the VM to submit its enrollment request,
# then auto-approve it with demo labels so the device appears in the UI.

# Re-login here because image_build may have run 30-60 min ago and the CLI
# session can go stale; also ensures the token is fresh before polling.
- name: Get flightctl API route for re-login
  command: >-
    oc get route flightctl-api-route -n {{ flightctl_namespace }}
    -o jsonpath='{.spec.host}'
  register: _fc_api_host
  changed_when: false

- name: Re-login to flightctl CLI before polling enrollment requests
  command: >-
    flightctl login https://{{ _fc_api_host.stdout | trim }}
    --token={{ ocp_token }}
    --insecure-skip-tls-verify
  no_log: true
  changed_when: true

- name: Wait for satellite-sim enrollment request to appear
  shell: |
    flightctl get enrollmentrequests -o json 2>/dev/null |
    python3 -c "
    import sys, json
    try:
      items = json.load(sys.stdin).get('items', [])
      print(items[0]['metadata']['name'] if items else '')
    except Exception:
      print('')
    "
  register: _er_name
  until: _er_name.stdout | trim | length > 0
  retries: 30
  delay: 10
  changed_when: false
  failed_when: false

- name: Approve enrollment request with demo labels
  command: >-
    flightctl approve enrollmentrequest/{{ _er_name.stdout | trim }}
    -l role=satellite-sim
    -l demo=ussf-ddil
  changed_when: true

- name: Display VM connection info
  debug:
    msg:
      - "VM is up at {{ vm_ip }}"
      - "SSH: ssh demo@{{ vm_ip }}  (password: satellite)"
      - "skupper-init.service will link to OCP in the background — allow ~30 seconds"
      - "Satellite registered in Edge Manager as: {{ _er_name.stdout | trim }}"
