---
- name: Build satellite-sim container image
  command: >-
    podman build
    -t {{ bootc_image_tag }}
    {{ satellite_demo_src }}
  changed_when: true

- name: Remove any existing image archive
  file:
    path: /tmp/satellite-sim.tar
    state: absent

- name: Save image to archive for root import
  command: >-
    podman save {{ bootc_image_tag }}
    -o /tmp/satellite-sim.tar
  changed_when: true
