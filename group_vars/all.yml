# ----- OCP / Skupper ----------------------------------------------------------
ocp_namespace: satellite-ground

skupper_grant_name: satellite-vm-token
skupper_grant_redemptions: 5
skupper_grant_expiration: 168h

# ----- VM ---------------------------------------------------------------------
vm_name: satellite-sim
vm_memory: 5120
vm_vcpus: 2
vm_image_dest: /var/lib/libvirt/images/satellite-sim.qcow2

# ----- Source paths -----------------------------------------------------------
# Path to the satellite-demo source repo.
# Default: sibling directory alongside this repo.
# Override: ansible-playbook site.yml -e satellite_demo_src=/path/to/satellite-demo
satellite_demo_src: "{{ playbook_dir }}/../satellite-demo"

bootc_output_dir: "{{ satellite_demo_src }}/output"
bootc_image_tag: "satellite-sim:latest"
bootc_image_builder_image: "ghcr.io/osbuild/bootc-image-builder:latest"

# ----- Local registry (DDIL bootc switch) -------------------------------------
# registry:2 runs on the build host at port 5000, reachable from the satellite
# VM over the KVM bridge (192.168.122.1:5000) even when OCP routes are blocked.
local_registry_port: 5000
local_registry_host: "192.168.122.1"
local_registry_name: "satellite-registry"
ollama_model: "llama3.2:1b"
# Where the Ollama service stores models. When Ollama runs as a system service
# (installed via install.sh), models go to the ollama user's home, not ~/.ollama.
# Override if your setup differs: -e ollama_models_dir=~/.ollama/models
ollama_models_dir: "/usr/share/ollama/.ollama/models"

# ----- Edge Manager (flightctl) -----------------------------------------------
# Red Hat Edge Manager installs on OCP via the openshift-helm-charts Helm repo.
# Requires an active Red Hat Edge Manager subscription.
flightctl_namespace: flightctl
flightctl_chart_version: "1.0.2"
# OCP user granted flightctl org-admin access.
# Defaults to whoever is logged in when the playbook runs (oc whoami).
# Override only if you need a different user: -e flightctl_admin_user=someuser
flightctl_admin_user: "{{ _oc_whoami.stdout | trim }}"
