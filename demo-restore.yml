---
# demo-restore.yml — Restore ground station connectivity and sync offline alerts
#
# Run this after demo-ddil.yml. The satellite VM is currently in offline mode.
# This playbook restores connectivity, watches the EDA detect it, observes the
# autonomous bootc switch back to the online image, and shows the offline alerts
# appearing in the ground station UI.
#
# Usage: ansible-playbook demo-restore.yml --ask-become-pass

- name: DEMO — Restore connectivity and sync offline alerts to ground station
  hosts: localhost
  connection: local
  gather_facts: false

  tasks:

    # ── Setup ────────────────────────────────────────────────────────────────

    - name: Resolve satellite VM IP address
      command: >-
        virsh --connect qemu:///system domifaddr {{ vm_name }}
      register: domifaddr
      become: true
      changed_when: false

    - name: Parse VM IP
      set_fact:
        vm_ip: "{{ domifaddr.stdout | regex_search('(\\d+\\.\\d+\\.\\d+\\.\\d+)') }}"

    - name: Resolve ground station hostname
      command: >-
        oc get route ground-station -n {{ ocp_namespace }}
        -o jsonpath='{.spec.host}'
      register: gs_route
      changed_when: false

    - name: Confirm satellite VM (offline image) is reachable
      wait_for:
        host: "{{ vm_ip }}"
        port: 22
        timeout: 15

    # ── Restore connectivity ──────────────────────────────────────────────────

    - name: "[RESTORE] Connectivity restored — removing ground station hostname block"
      shell: >-
        sshpass -p satellite ssh -o StrictHostKeyChecking=no demo@{{ vm_ip }}
        "sudo sed -i '/{{ gs_route.stdout }}/d' /etc/hosts"
      changed_when: true

    # ── Watch EDA detect reconnect ────────────────────────────────────────────
    # Blocks until the reconnect rulebook fires (~60s). The audience watches
    # the task name while Ansible waits for the autonomous response.

    - name: "[EDA] Waiting for reconnect detection and autonomous switch back to online..."
      shell: >-
        sshpass -p satellite ssh -o StrictHostKeyChecking=no demo@{{ vm_ip }}
        "sudo journalctl -fu satellite-eda --no-hostname |
         grep --line-buffered -m 1 'online image staged\|CONNECTIVITY RESTORED'"
      register: eda_reconnect
      changed_when: false

    - name: "[EDA] Reconnect confirmed — bootc switch to online image triggered"
      debug:
        msg: "{{ eda_reconnect.stdout_lines }}"

    # ── Wait for reboot cycle ────────────────────────────────────────────────

    - name: "[BOOTC] Waiting for VM to reboot into online image..."
      wait_for:
        host: "{{ vm_ip }}"
        port: 22
        state: absent
        timeout: 90
      ignore_errors: true

    - name: "[BOOTC] Starting VM after reboot (KVM restores power)"
      command: virsh --connect qemu:///system start {{ vm_name }}
      become: true
      failed_when: false
      changed_when: true

    - name: "[BOOTC] Waiting for satellite to come back online..."
      wait_for:
        host: "{{ vm_ip }}"
        port: 22
        timeout: 120

    # ── Confirm online mode and offline alert sync ────────────────────────────

    - name: "[ONLINE] Confirming online image is booted"
      shell: >-
        sshpass -p satellite ssh -o StrictHostKeyChecking=no demo@{{ vm_ip }}
        "sudo bootc status --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d[\"status\"][\"booted\"][\"image\"][\"image\"][\"image\"])'"
      register: booted_image
      changed_when: false

    - name: "[ONLINE] Satellite back on online image — ground station link re-establishing"
      debug:
        msg: "Booted image: {{ booted_image.stdout }}"

    - name: "[SYNC] Waiting for satellite-sim to start and load offline alert queue..."
      shell: >-
        sshpass -p satellite ssh -o StrictHostKeyChecking=no demo@{{ vm_ip }}
        "sudo journalctl -u satellite-sim --no-hostname --since '1 minute ago' |
         grep --line-buffered -m 1 'offline.*alert\|offline-queue\|Offline queue'"
      register: queue_load
      changed_when: false
      failed_when: false

    - name: "[SYNC] Count offline alerts flushed to ground station"
      shell: >-
        sshpass -p satellite ssh -o StrictHostKeyChecking=no demo@{{ vm_ip }}
        "wc -l < /var/lib/satellite-sim/offline-queue.jsonl.loaded 2>/dev/null || echo 0"
      register: offline_count
      changed_when: false
      failed_when: false

    - name: "[SYNC] Offline alerts synced — check ground station UI for teal OFFLINE badges"
      debug:
        msg: >-
          {{ offline_count.stdout | trim }} alert(s) classified offline during DDIL
          are now visible in the ground station UI with OFFLINE badges.
          Open {{ 'https://' + gs_route.stdout }} to see them.

    - name: "[LINK] Waiting for Skupper link to re-establish..."
      shell: >-
        sshpass -p satellite ssh -o StrictHostKeyChecking=no demo@{{ vm_ip }}
        "for i in $(seq 1 18); do
           sudo test -f /var/lib/skupper/.linked && echo linked && exit 0;
           sleep 10;
         done; echo unlinked"
      register: link_status
      changed_when: false

    - name: "[LINK] Ground station link status"
      debug:
        msg: "Skupper link: {{ link_status.stdout | trim }}"
